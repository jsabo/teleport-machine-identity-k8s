# The pod's identity towards Teleport. Its projected token is what the sidecar
# joins with; the Auth Service verifies it against the cluster's signing keys
# pinned in the join token. No Kubernetes RBAC is needed: the pod calls nothing
# in the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-status
  namespace: db-status
automountServiceAccountToken: false
